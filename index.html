<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מתקן האייפון</title>
<style>
:root{
  --bg:#eef1f7;--glow:rgba(10,132,255,.18);--card:rgba(255,255,255,.85);--line:rgba(0,0,0,.08);--text:#0b0f1a;--muted:#5c6478;
  --blue:#0a6cff;--cyan:#00a7c7;--warn:#d97706;--ok:#1f9d55;--blue-bg:rgba(10,108,255,.12);--alert-bg:rgba(246,246,246,.94);--sep:#d1d1d6;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#05070d;--glow:rgba(10,132,255,.28);--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--text:#f1f4fb;--muted:#8d96ab;
  --blue:#2e8bff;--cyan:#33d6f5;--warn:#ffb340;--ok:#32d583;--blue-bg:rgba(46,139,255,.2);--alert-bg:rgba(44,44,46,.94);--sep:#38383a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05070d;--glow:rgba(10,132,255,.28);--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--text:#f1f4fb;--muted:#8d96ab;--blue:#2e8bff;--cyan:#33d6f5;--warn:#ffb340;--ok:#32d583;--blue-bg:rgba(46,139,255,.2);--alert-bg:rgba(44,44,46,.94);--sep:#38383a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);background-image:radial-gradient(520px 320px at 85% -40px,var(--glow),transparent),radial-gradient(420px 300px at 0% 30%,rgba(0,200,255,.10),transparent);background-attachment:fixed;color:var(--text);font-family:-apple-system,"SF Pro Text","Helvetica Neue","Segoe UI",Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:26px 16px 48px}
h1{font-size:34px;font-weight:800;margin:0 0 16px;letter-spacing:-.4px}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.health{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:18px}
.health svg{width:86px;height:86px;flex:none}
.health b{display:block;font-size:19px}
.health span{color:var(--muted);font-size:14px}
.all{margin-top:10px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-weight:700;font-size:15px;border-radius:999px;padding:8px 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:14px;display:flex;flex-direction:column;gap:6px;text-align:start}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin-bottom:6px}
.ic svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:16px;font-weight:600}
.chip{font-size:12.5px;color:var(--warn)}
.chip.g{color:var(--ok)}
.fix{margin-top:8px;background:var(--blue-bg);color:var(--blue);font-weight:700;font-size:15px;border-radius:12px;padding:9px}
.fix:active{opacity:.6}
#scan{display:none;text-align:center;padding-top:40px}
#scan h2{font-size:22px;margin:0 0 22px}
.ring{position:relative;width:200px;height:200px;margin:0 auto 24px}
.ring svg{width:200px;height:200px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:var(--line)}
.ring .pr{stroke:var(--cyan);stroke-dasharray:502.65;stroke-dashoffset:502.65;filter:drop-shadow(0 0 8px var(--cyan))}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;font-weight:800;font-variant-numeric:tabular-nums}
#log{margin:0 auto;max-width:360px;padding:12px 14px;text-align:start;font-size:13.5px;line-height:1.9;color:var(--muted);min-height:130px}
#log div:last-child{color:var(--text)}
#log .bad{color:var(--warn)}
#ios{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:24px}
.dlg{width:270px;background:var(--alert-bg);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;text-align:center;overflow:hidden;color:var(--text)}
.dlg .body{padding:18px 16px 16px}
.dlg h3{margin:0 0 4px;font-size:17px;font-weight:600}
.dlg p{margin:0 0 10px;font-size:13px;line-height:1.35}
.dlg p:last-child{margin:0}
.dlg button{display:block;width:100%;background:transparent;color:var(--blue);font-size:17px;padding:12px;border-top:.5px solid var(--sep)}
.dlg button:active{background:var(--blue-bg)}
@media (prefers-reduced-motion:no-preference){#ios.on .dlg{animation:pop .22s ease-out}}
@keyframes pop{from{transform:scale(1.12);opacity:0}to{transform:scale(1);opacity:1}}
#scare{display:none;position:fixed;inset:0;z-index:100;background:#000;color:#ff1a1a;align-items:center;justify-content:center;text-align:center;padding:24px;flex-direction:column;overflow:hidden}
#scare::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.85))}
#scareText{font-size:34px;font-weight:800;line-height:1.3;text-shadow:0 0 18px #f00;max-width:420px;position:relative;z-index:1}
#scare svg{width:130px;margin-bottom:22px;position:relative;z-index:1}
#scare.flash{background:#6a0000}
@media (prefers-reduced-motion:no-preference){#scareText.glitch{animation:glitch .25s steps(2) 2}#scare svg{animation:pulse 1.2s infinite}}
@keyframes glitch{0%{transform:translate(0,0)}25%{transform:translate(-6px,3px) skewX(6deg)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,-5px) skewX(-6deg)}100%{transform:translate(0,0)}}
@keyframes pulse{50%{transform:scale(1.15)}}
#reveal{display:none;text-align:center;padding-top:90px}
#reveal h2{font-size:36px;margin:0 0 10px;color:var(--ok)}
#reveal p{color:var(--muted);font-size:17px;margin:0 0 26px}
#again{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-weight:700;font-size:17px;border-radius:14px;padding:13px 32px}
</style>
</head>
<body>
<main>
  <section id="home">
    <h1>מתקן האייפון</h1>
    <div class="panel health">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--warn)" stroke-width="9" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="74" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">72%</text></svg>
      <div><b>בריאות המכשיר</b><span>נמצאו 12 פריטים לבדיקה</span><br><button class="all" id="all">תקן הכול</button></div>
    </div>
    <div class="grid" id="list"></div>
  </section>

  <section id="scan" aria-live="polite">
    <h2 id="scanTitle">מתקן</h2>
    <div class="ring"><svg viewBox="0 0 200 200"><circle class="tr" cx="100" cy="100" r="80"/><circle class="pr" id="pr" cx="100" cy="100" r="80"/></svg><div class="n" id="pct">0%</div></div>
    <div class="panel" id="log"></div>
  </section>

  <section id="reveal">
    <h2>זו מתיחה!</h2>
    <p>האייפון שלך בסדר גמור. לא נפרץ כלום ואף אחד לא עוקב אחריך.</p>
    <button id="again">חזרה</button>
  </section>
</main>

<div id="ios" role="alertdialog" aria-modal="true" aria-labelledby="ioT">
  <div class="dlg">
    <div class="body">
      <h3 id="ioT">האייפון שלך נפרץ</h3>
      <p>כל הפעולות שלך במכשיר נעקבות על ידי האקר.</p>
      <p>נדרשת פעולה מיידית!</p>
    </div>
    <button id="more">אוקיי</button>
  </div>
</div>

<section id="scare" role="alert" aria-live="assertive">
  <svg viewBox="0 0 100 60" aria-hidden="true"><path d="M5 30Q50 -5 95 30Q50 65 5 30Z" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="50" cy="30" r="12" fill="currentColor"/></svg>
  <div id="scareText"></div>
</section>

<script>
const items=[
  {c:"#30c85e",t:"סוללה",s:"מומלץ לתקן",p:'<rect x="3" y="8" width="16" height="8" rx="2"/><path d="M21 11v2"/>'},
  {c:"#2e8bff",t:"Wi‑Fi וסלולר",s:"חיבור לא יציב",p:'<path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0"/><circle cx="12" cy="19" r="1"/>'},
  {c:"#8e8e93",t:"אחסון",s:"מלא ב‑87%",p:'<rect x="4" y="5" width="16" height="6" rx="1.5"/><rect x="4" y="13" width="16" height="6" rx="1.5"/>'},
  {c:"#ff9500",t:"מצלמה",s:"מומלץ לתקן",p:'<rect x="3" y="7" width="18" height="12" rx="3"/><circle cx="12" cy="13" r="3.2"/>'},
  {c:"#af52de",t:"רמקול ומיקרופון",s:"נמצאה תקלה",p:'<path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16 9a4 4 0 010 6"/>'},
  {c:"#3a6df0",t:"בלוטות׳",s:"מומלץ לתקן",p:'<path d="M7 7l10 10-5 5V2l5 5L7 17"/>'},
  {c:"#00b8d9",t:"מסך ותצוגה",s:"תקין חלקית",g:1,p:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/>'},
  {c:"#ff453a",t:"מיקום ופרטיות",s:"נמצאה תקלה",p:'<path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'},
  {c:"#5e5ce6",t:"אפליקציות",s:"3 אפליקציות איטיות",p:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'},
  {c:"#32ade6",t:"iCloud",s:"תקין חלקית",g:1,p:'<path d="M7 18a4 4 0 010-8 5 5 0 019.6-1A4.5 4.5 0 0117 18H7z"/>'},
  {c:"#64748b",t:"מקלדת",s:"מומלץ לתקן",p:'<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>'},
  {c:"#f5a524",t:"טעינה",s:"איטית מהרגיל",p:'<path d="M13 2L5 14h6l-1 8 8-12h-6l1-8z"/>'}
];
const $=id=>document.getElementById(id);
const show=id=>["home","scan","scare","reveal"].forEach(s=>$(s).style.display=(s===id?(id==="scare"?"flex":"block"):"none"));
$("list").innerHTML=items.map((x,n)=>`<div class="panel tile"><div class="ic" style="background:linear-gradient(145deg,${x.c},${x.c}99);box-shadow:0 8px 18px -6px ${x.c}"><svg viewBox="0 0 24 24">${x.p}</svg></div><b>${x.t}</b><span class="chip${x.g?" g":""}">${x.s}</span><button class="fix" data-n="${n}">תקן</button></div>`).join("");
$("list").addEventListener("click",e=>{const b=e.target.closest("button");if(b)fix(items[b.dataset.n])});
$("all").onclick=()=>fix({t:"הכול"});

const DUR=40000;
const logLines=[
  [0,"מתחיל בדיקת מערכת"],[6,"בודק הרשאות אפליקציות"],[13,"סורק קבצי מערכת"],[21,"מנתח חיבורים פעילים"],[30,"בודק תהליכי רקע"],
  [42,"בודק גישה למצלמה ולמיקרופון"],[54,"מאמת חתימות מערכת"],[66,"מנתח תעבורת רשת"],
  [76,"זוהה תהליך לא מוכר",1],[84,"נמצא חיבור חיצוני פעיל",1],[91,"הנתונים עוברים לשרת לא מזוהה",1],[97,"מסיים בדיקה"]
];
function fix(it){
  show("scan");
  $("scanTitle").textContent="מתקן: "+it.t;
  const log=$("log"),pr=$("pr");log.innerHTML="";let shown=0;const t0=Date.now();
  const iv=setInterval(()=>{
    const p=Math.min((Date.now()-t0)/DUR,1),pc=Math.floor(p*100);
    pr.style.strokeDashoffset=502.65*(1-p);$("pct").textContent=pc+"%";
    while(shown<logLines.length&&pc>=logLines[shown][0]){const d=document.createElement("div");if(logLines[shown][2])d.className="bad";d.textContent=logLines[shown][1];log.appendChild(d);while(log.children.length>5)log.removeChild(log.firstChild);shown++}
    if(p>=1){clearInterval(iv);setTimeout(()=>{
      const o=$("ios");o.style.display="flex";o.classList.remove("on");void o.offsetWidth;o.classList.add("on");
      if(navigator.vibrate)navigator.vibrate([200,100,200]);
    },400)}
  },200);
}

let ac=null,out=null,master=null,timers=[],running=false;
const msgs=["אל תכבה את הטלפון","אני רואה אותך","המצלמה שלך פועלת","אתה לא לבד בחדר","מי מאחוריך?","אני יודע איפה אתה נמצא","אל תסתכל אחורה","עוד רגע זה נגמר","שמעת את זה?"];
const T=(fn,ms)=>timers.push(setTimeout(()=>running&&fn(),ms));
function tone(f,d,type,vol,to,det){const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(det)o.detune.value=det;if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(out);o.start();o.stop(t+d)}
function noise(d,f0,f1,vol,q){const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter(),t=ac.currentTime;f.type="bandpass";f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);const g=ac.createGain();g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(vol,t+d*0.3);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(g);g.connect(out);s.start()}
function stopScare(){running=false;timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[];try{ac&&ac.close()}catch(e){}ac=null;try{speechSynthesis.cancel()}catch(e){}if(navigator.vibrate)navigator.vibrate(0);$("scare").classList.remove("flash")}
function audio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
  const len=ac.sampleRate*3,ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5)}
  const rev=ac.createConvolver();rev.buffer=ir;const rg=ac.createGain();rg.gain.value=0.7;rev.connect(rg);rg.connect(master);
  out=ac.createGain();out.connect(master);out.connect(rev);
  // dissonant pad with slow filter sweep
  const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=380;const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=0.18;lg.gain.value=220;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  const pg=ac.createGain();pg.gain.value=0.09;lp.connect(pg);pg.connect(out);
  [55,58.3,82.4,116.5].forEach(f=>{const o=ac.createOscillator();o.type="sawtooth";o.frequency.value=f;o.connect(lp);o.start()});
  // sub rumble
  const sub=ac.createOscillator(),sg=ac.createGain();sub.type="sine";sub.frequency.value=32;sg.gain.value=0.5;sub.connect(sg);sg.connect(out);sub.start();
  // creeping high tone (tinnitus-like) rising through the minute
  const hi=ac.createOscillator(),hg=ac.createGain(),t=ac.currentTime;hi.type="sine";hi.frequency.setValueAtTime(900,t);hi.frequency.linearRampToValueAtTime(3200,t+60);hg.gain.setValueAtTime(0.004,t);hg.gain.linearRampToValueAtTime(0.06,t+60);hi.connect(hg);hg.connect(out);hi.start();
  // accelerating heartbeat
  let period=1200;const beat=()=>{tone(58,0.28,"sine",1,32);setTimeout(()=>ac&&tone(52,0.25,"sine",0.8,30),200);period=Math.max(430,period-16);T(beat,period)};T(beat,600);
  // metallic scrape + breath
  const scrape=()=>{noise(1.6,350,3800,0.25,6);T(scrape,4000+Math.random()*3000)};T(scrape,3500);
  const breath=()=>{noise(1.8,1800,900,0.18,0.8);T(breath,3500+Math.random()*2500)};T(breath,2000);
  // silence, then jump stinger
  const stinger=()=>{
    const n=ac.currentTime;master.gain.cancelScheduledValues(n);master.gain.setTargetAtTime(0,n,0.04);
    T(()=>{
      const m=ac.currentTime;master.gain.cancelScheduledValues(m);master.gain.setValueAtTime(1.4,m);
      [233,247,311,370,466,622].forEach((f,i)=>tone(f,1.8,"sawtooth",0.16,f*0.8,(i%2?-35:35)));
      tone(3400,0.9,"square",0.12,300);noise(0.9,2500,200,0.7,0.5);tone(40,1.4,"sine",1.2,25);
      const sc=$("scare");sc.classList.add("flash");setTimeout(()=>sc.classList.remove("flash"),260);
      if(navigator.vibrate)navigator.vibrate([600,80,300]);
      T(()=>master.gain.setTargetAtTime(1,ac.currentTime,0.3),500);
    },2200);
    T(stinger,11000+Math.random()*4000);
  };
  T(stinger,7000);
}
function startScare(){
  $("ios").style.display="none";
  show("scare");running=true;
  try{audio()}catch(e){}
  const txt=$("scareText"),sc=$("scare");let i=0;
  const next=()=>{txt.textContent=msgs[i++%msgs.length];txt.classList.remove("glitch");void txt.offsetWidth;txt.classList.add("glitch");sc.classList.add("flash");setTimeout(()=>sc.classList.remove("flash"),120);if(navigator.vibrate)navigator.vibrate([300,100,300,100,600]);
    if(i%3===1)try{const u=new SpeechSynthesisUtterance(txt.textContent);u.lang="he-IL";u.pitch=0.1;u.rate=0.6;speechSynthesis.speak(u)}catch(e){}};
  next();timers.push(setInterval(next,3500));
  timers.push(setTimeout(()=>{stopScare();show("reveal")},60000));
}
$("more").onclick=startScare;
$("again").onclick=()=>show("home");
show("home");
</script>
</body>
</html>
